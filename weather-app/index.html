<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="weather-app">
        <h1>Погодное приложение</h1>
        
        <div class="search-container">
            <input 
                type="text" 
                id="city-input" 
                placeholder="Введите город..." 
                autocomplete="off"
            >
            <button id="search-btn">Поиск</button>
        </div>

        <div class="weather-display">
            <div class="loading">Загрузка...</div>
            <div class="weather-card hidden">
                <h2 id="city-name">—</h2>
                <div class="weather-info">
                    <img id="weather-icon" src="" alt="Weather Icon">
                    <span id="temperature">—</span>
                </div>
                <div class="details">
                    <p>Влажность: <span id="humidity">—</span>%</p>
                    <p>Ветер: <span id="wind">—</span> м/с</p>
                    <p>Описание: <span id="description">—</span></p>
                </div>
            </div>
            <div class="error hidden">Город не найден. Попробуйте еще раз.</div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
